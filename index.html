<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Asterisc Technocrat — Intern Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ══ LOADER ══ -->
<div id="loader">
  <div class="loader-inner">

    <div class="loader-logo-wrap">
      <div class="loader-logo">ASTERISC TECHNOCRAT</div>
      <div class="loader-sub">✦ INTERN MANAGEMENT SYSTEM ✦</div>
    </div>

    <!-- Animated ring -->
    <div class="loader-ring">
      <svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="loaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00dcb9"/>
            <stop offset="100%" stop-color="#3d8bff"/>
          </linearGradient>
        </defs>
        <circle class="loader-ring-track" cx="28" cy="28" r="22"/>
        <circle class="loader-ring-fill" cx="28" cy="28" r="22"/>
      </svg>
    </div>

    <!-- Progress bar -->
    <div class="loader-bar-wrap">
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
      <div class="loader-status" id="loaderStatus">Initializing system...</div>
    </div>

    <!-- Dots -->
    <div class="loader-dots">
      <span></span><span></span><span></span>
    </div>

  </div>
</div>

<!-- ══ BACKGROUND ══ -->
<div class="bg-canvas"></div>
<div class="grid-lines"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<!-- ══ SIDEBAR OVERLAY (mobile) ══ -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- ══ APP ══ -->
<div class="app">

  <!-- Header -->
  <header>
    <div>
      <div class="logo-wrap">
        <span class="logo-asterisc">Asterisc</span>
        <span class="logo-technocrat">Technocrat</span>
      </div>
      <div class="logo-tag">✦ INTERN MANAGEMENT SYSTEM ✦</div>
    </div>

    <div class="header-right">
      <div class="live-badge">
        <div class="live-dot"></div>
        <span>LIVE TRACKING</span>
      </div>
      <!-- Hamburger — mobile -->
      <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          type="text"
          id="searchInput"
          placeholder="Search intern or project..."
          oninput="filterInterns()"
          autocomplete="off"
        />
      </div>
    </div>

    <div class="list-header">
      <span class="list-title">INTERNS</span>
      <span class="count-badge" id="countBadge">0</span>
    </div>

    <div class="intern-list" id="internList"></div>
  </aside>

  <!-- Detail Panel -->
  <main class="detail">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
      </div>
      <div class="empty-text">Select an intern</div>
      <div class="empty-sub">Click any card to view performance details</div>
    </div>

    <div class="detail-scroll" id="detailScroll" style="display:none;"></div>
  </main>

</div>

<script>
  /* ── Mobile Sidebar Toggle ── */
  function toggleSidebar() {
    const sidebar  = document.getElementById('sidebar');
    const overlay  = document.getElementById('sidebarOverlay');
    const isOpen   = sidebar.classList.contains('open');
    if (isOpen) {
      closeSidebar();
    } else {
      sidebar.classList.add('open');
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('active');
    document.body.style.overflow = '';
  }

  /* Close sidebar on intern select (mobile) */
  const _origSelectIntern = window.selectIntern;
  document.addEventListener('DOMContentLoaded', () => {
    const origList = document.getElementById('internList');
    origList.addEventListener('click', () => {
      if (window.innerWidth <= 768) closeSidebar();
    });
  });

  /* ── Loader ── */
  const statusMessages = [
    'Initializing system...',
    'Loading intern data...',
    'Connecting to server...',
    'Almost ready...'
  ];

  let msgIdx = 0;
  const statusEl = document.getElementById('loaderStatus');

  const msgInterval = setInterval(() => {
    msgIdx = (msgIdx + 1) % statusMessages.length;
    statusEl.style.opacity = '0';
    setTimeout(() => {
      statusEl.textContent = statusMessages[msgIdx];
      statusEl.style.opacity = '1';
    }, 200);
  }, 500);

  statusEl.style.transition = 'opacity 0.2s ease';

  // Hide loader after bar fills (~2.2s)
  setTimeout(() => {
    clearInterval(msgInterval);
    statusEl.textContent = 'Ready!';
    statusEl.style.color = 'var(--teal)';
    setTimeout(() => {
      document.getElementById('loader').classList.add('hide');
    }, 350);
  }, 2100);
</script>

<script src="script.js"></script>
</body>
</html>
